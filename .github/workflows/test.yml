name: Test SilicIA

# Runs the complete SilicIATests test suite covering:
# - Math-accuracy regression suite (chunker integrity, boundary splits, RAG relevance)
# - Tool calling, ToolKit budgeting, and ToolCallGovernor
# - Web search services (DuckDuckGo, Wikipedia API, multilingual queries)
# - Query expansion and Wikipedia query cleaner
# - Prompt templates and model answering integrity
# - View rendering, token budgeting, and sanitizers
#
# Run on every push, PR, and on-demand via workflow_dispatch.

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-26
    env:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""

    steps:
    - uses: actions/checkout@v4

    - name: Restore Xcode Cache
      uses: irgaly/xcode-cache@v1
      with:
        key: xcode-test-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          xcode-test-cache-${{ runner.os }}-${{ github.ref_name }}-

    - name: Select Xcode
      run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

    - name: Xcode Version
      run: xcodebuild -version

    - name: Run Tests
      run: |
        set -o pipefail
        xcodebuild \
          -project SilicIA.xcodeproj \
          -scheme SilicIA \
          -configuration Debug \
          -destination "platform=macOS" \
          -only-testing:SilicIATests \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          test | tee /tmp/test.log

    - name: Verify SilicIATests ran and passed
      # Fail loudly if the SilicIATests suite was skipped or failed —
      # ensures all unit and integration test suites run and pass.
      run: |
        if ! grep -q "Test Suite 'SilicIATests.xctest' passed" /tmp/test.log; then
          echo "::error::SilicIATests.xctest did not run or did not pass — check the test log."
          exit 1
        fi
        if ! grep -q "\*\* TEST SUCCEEDED \*\*" /tmp/test.log; then
          echo "::error::Tests did not succeed — check the test log."
          exit 1
        fi
        echo "All SilicIATests ran and passed successfully:"
        grep -A 1 "Test Suite 'SilicIATests.xctest' passed" /tmp/test.log || true

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs
        path: /tmp/test.log

