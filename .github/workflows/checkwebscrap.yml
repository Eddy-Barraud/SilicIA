name: Check Web Search Sources

# Verifies live DuckDuckGo and Wikipedia search endpoints using the native Swift
# WebSearchService integration tests (WebSearchServiceTests). Runs only this tiny
# test target to check search provider availability, response structure, and HTML/JSON parsing.

on:
  schedule:
   Run weekly at 2 AM UTC every monday
    - cron: '0 2 * * 1'
  # Allow manual trigger for testing
  workflow_dispatch:

jobs:
  check-websearchservice-sources:
    runs-on: macos-26
    env:
      CODE_SIGNING_ALLOWED: "NO"
      CODE_SIGNING_REQUIRED: "NO"
      CODE_SIGN_IDENTITY: ""
      DEVELOPMENT_TEAM: ""

    steps:
    - uses: actions/checkout@v4

    - name: Restore Xcode Cache
      uses: irgaly/xcode-cache@v1
      with:
        key: xcode-websearch-cache-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
        restore-keys: |
          xcode-websearch-cache-${{ runner.os }}-${{ github.ref_name }}-

    - name: Select Xcode
      run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

    - name: Xcode Version
      run: xcodebuild -version

    - name: Run WebSearchServiceTests
      run: |
        set -o pipefail
        xcodebuild \
          -project SilicIA.xcodeproj \
          -scheme SilicIA \
          -configuration Debug \
          -destination "platform=macOS" \
          -only-testing:SilicIATests/WebSearchServiceTests \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          DEVELOPMENT_TEAM="" \
          test | tee /tmp/websearch-test.log

    - name: Verify WebSearchServiceTests ran and passed
      run: |
        if ! grep -q "Test Suite 'WebSearchServiceTests' passed" /tmp/websearch-test.log; then
          echo "::error::WebSearchServiceTests did not run or did not pass — check the test log."
          exit 1
        fi
        if ! grep -q "\*\* TEST SUCCEEDED \*\*" /tmp/websearch-test.log; then
          echo "::error::Search provider tests did not succeed — check the test log."
          exit 1
        fi
        echo "WebSearchServiceTests ran and passed successfully:"
        grep -A 1 "Test Suite 'WebSearchServiceTests' passed" /tmp/websearch-test.log || true

    - name: Upload Test Logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: websearch-test-logs
        path: /tmp/websearch-test.log
