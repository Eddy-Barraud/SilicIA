name: Build, Sign & Release DMG

on:
  push:
    tags:
      - 'v*' # Triggers on release tags like v1.0.0
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Release
    runs-on: macos-26

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer

      - name: Xcode Version
        run: xcodebuild -version

      - name: Install Apple Certificate (Developer ID Application)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_P12_PASSWORD }}
        run: |
          # Generate a random temporary password for the disposable CI keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          
          # Create and unlock temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import Developer ID certificate into keychain
          echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          
          # Set keychain in search list and make it default
          security list-keychains -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | tr -d '"')
          security default-keychain -s $KEYCHAIN_PATH

          # Verify identity and extract the exact certificate name
          echo "=== Installed Signing Identities ==="
          security find-identity -v -p codesigning $KEYCHAIN_PATH
          
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep "Developer ID Application:" | head -n 1 | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$SIGNING_IDENTITY" ]; then
            # Fallback to the first valid codesigning identity if not named Developer ID
            SIGNING_IDENTITY=$(security find-identity -v -p codesigning $KEYCHAIN_PATH | grep -E '^\s*1\)' | sed -E 's/.*"([^"]+)".*/\1/')
          fi
          
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "::error::No codesigning identity found in the imported .p12 certificate. Please verify that the .p12 contains the private key."
            exit 1
          fi
          
          echo "Using Signing Identity: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> $GITHUB_ENV
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV

      - name: Build & Archive App
        run: |
          xcodebuild clean archive \
            -project SilicIA.xcodeproj \
            -scheme SilicIA \
            -destination "generic/platform=macOS" \
            -archivePath "$RUNNER_TEMP/SilicIA.xcarchive" \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="-"

      - name: Export & Sign .app
        run: |
          mkdir -p "$RUNNER_TEMP/Export"
          cp -R "$RUNNER_TEMP/SilicIA.xcarchive/Products/Applications/SilicIA.app" "$RUNNER_TEMP/Export/SilicIA.app"
          APP_PATH="$RUNNER_TEMP/Export/SilicIA.app"

          # 1. Sign embedded resource bundles (e.g. MathJax)
          if [ -d "$APP_PATH/Contents/Resources/MathJaxSwift_MathJaxSwift.bundle" ]; then
            echo "Signing MathJax bundle..."
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN_PATH" \
              --sign "$SIGNING_IDENTITY" \
              "$APP_PATH/Contents/Resources/MathJaxSwift_MathJaxSwift.bundle"
          fi

          # 2. Sign embedded app extensions with their specific entitlements
          if [ -d "$APP_PATH/Contents/PlugIns/SilicIAShareExtension.appex" ]; then
            echo "Signing SilicIAShareExtension.appex with entitlements..."
            codesign --force --options runtime --timestamp \
              --keychain "$KEYCHAIN_PATH" \
              --entitlements "SilicIAShareExtension/SilicIAShareExtension.entitlements" \
              --sign "$SIGNING_IDENTITY" \
              "$APP_PATH/Contents/PlugIns/SilicIAShareExtension.appex"
          fi

          # 3. Sign any embedded frameworks or dylibs if present
          if [ -d "$APP_PATH/Contents/Frameworks" ]; then
            find "$APP_PATH/Contents/Frameworks" -type f \( -name "*.dylib" -o -perm +111 \) | while read -r lib; do
              echo "Signing framework/dylib: $lib"
              codesign --force --options runtime --timestamp \
                --keychain "$KEYCHAIN_PATH" \
                --sign "$SIGNING_IDENTITY" \
                "$lib"
            done
          fi

          # 4. Sign the main application bundle with its entitlements
          echo "Signing main SilicIA.app with entitlements..."
          codesign --force --options runtime --timestamp \
            --keychain "$KEYCHAIN_PATH" \
            --entitlements "SilicIA/SilicIA.entitlements" \
            --sign "$SIGNING_IDENTITY" \
            "$APP_PATH"

          # 5. Verify the full signature
          echo "=== Verifying App Signature ==="
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create DMG
        run: |
          mkdir -p "$RUNNER_TEMP/dmg-source"
          cp -R "$RUNNER_TEMP/Export/SilicIA.app" "$RUNNER_TEMP/dmg-source/"
          ln -s /Applications "$RUNNER_TEMP/dmg-source/Applications"
          
          mkdir -p "$RUNNER_TEMP/dmg-output"
          hdiutil create -volname "SilicIA" \
            -srcfolder "$RUNNER_TEMP/dmg-source" \
            -ov -format UDZO \
            "$RUNNER_TEMP/dmg-output/SilicIA.dmg"

      - name: Sign DMG
        run: |
          codesign --force \
            --keychain "$KEYCHAIN_PATH" \
            --sign "$SIGNING_IDENTITY" \
            --timestamp \
            "$RUNNER_TEMP/dmg-output/SilicIA.dmg"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "$RUNNER_TEMP/dmg-output/SilicIA.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

      - name: Staple Notarization Ticket
        run: |
          xcrun stapler staple "$RUNNER_TEMP/dmg-output/SilicIA.dmg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ runner.temp }}/dmg-output/SilicIA.dmg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
